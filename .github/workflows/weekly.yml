name: This Week's Releases

# Rebuilds on every push to main and DAILY; notifies only on Fridays
# (manual workflow_dispatch runs always notify).
on:
  push:
    branches: [main]       # rebuild the page whenever code lands on main
    paths-ignore:
      - '.last-refresh'    # the keepalive stamp below — not worth a rebuild, and
                           # ignoring it is what stops the keepalive from looping
  schedule:
    - cron: "0 15 * * *"   # daily 15:00 UTC = 11:00 EDT (10:00 EST in winter)
  workflow_dispatch: {}

# Needed for GitHub Pages deploys. The keepalive step pushes with its own PAT, so
# the job's GITHUB_TOKEN still only needs read access to contents.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Job-level so the steps below can test them in `if:` (step-level env is not
    # available to a step's own `if`). HAS_CF lets the whole Cloudflare path stay
    # dormant until the secrets exist, so merging this cannot break the daily run.
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CF_HOST: ${{ secrets.CF_HOST }}
    steps:
      # Register the hostname as a masked value before any step can print it.
      # Secrets are auto-masked, but only as exact strings — CF_HOST is the bare
      # host precisely so it also gets masked when it appears *inside* a longer
      # URL emitted by wrangler or by this_weeks_releases.py.
      - name: Mask private hostname
        if: ${{ env.CF_HOST != '' }}
        run: echo "::add-mask::$CF_HOST"

      - uses: actions/checkout@v6
        with:
          # Don't leave GITHUB_TOKEN's Authorization header behind in .git/config.
          # git prefers that header over credentials embedded in a remote URL, so
          # the Keepalive step's push went out as github-actions[bot] and 403'd
          # (this job's token is contents:read). Nothing else here needs git auth.
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Fetches fresh from TMDB/IMDb and writes the HTML page. --cache here just
      # stores the resolved data on this runner so the Notify step can reuse it
      # (no second fetch); the runner is ephemeral, so every run still fetches fresh.
      - name: Generate page
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 this_weeks_releases.py --cache --html-out _site/index.html

      # Cloudflare serves the page at <host>/tv-releases, so the file has to sit
      # at that path inside the assets directory. Kept in its own _cf/ tree
      # rather than reusing _site/ so the Pages copy is not uploaded twice and
      # cannot be reached at Cloudflare's root. version.txt comes along because
      # the page polls for it (this_weeks_releases.py writes it beside the HTML).
      - name: Stage Cloudflare assets
        if: ${{ env.HAS_CF == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p _cf/tv-releases
          cp _site/index.html _site/version.txt _cf/tv-releases/
          cp cloudflare/_headers _cf/_headers

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Second deploy target, running in parallel with Pages until this one is
      # trusted. No route is passed: it is attached in the Cloudflare dashboard
      # so the hostname never appears in this public repo. See wrangler.toml.
      - name: Deploy to Cloudflare
        if: ${{ env.HAS_CF == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Page is now live — send the Pushcut notification linking to it.
      # Scheduled runs notify only on Fridays; manual runs always.
      # --cache reuses the data from the Generate step (no extra API calls).
      - name: Notify via Pushcut
        env:
          TMDB_API_KEY: unused-uses-cache
          PUSHCUT_WEBHOOK: ${{ secrets.PUSHCUT_WEBHOOK }}
          # Point the notification at the Cloudflare URL once PAGE_URL is set as
          # a secret; until then fall back to the Pages URL so nothing changes.
          # Flipping this one secret is how you switch over, with no code change.
          PAGE_URL: ${{ secrets.PAGE_URL != '' && secrets.PAGE_URL || steps.deployment.outputs.page_url }}
        run: python3 this_weeks_releases.py --cache --html-out '' --notify ${{ github.event_name == 'workflow_dispatch' && 'always' || 'auto' }}

      # Push a timestamp back to main so the repo keeps registering activity.
      #
      # GitHub auto-disables `schedule:` triggers after 60 days without repository
      # activity, and this repo by design never receives organic commits. That is
      # exactly what silently killed the daily run on 2026-08-06: re-enabling the
      # workflow in the UI flipped its state back to active but did not resume the
      # cron, because workflow runs (including manual dispatches) do NOT count as
      # activity. Only a push does.
      #
      # Uses a PAT rather than the built-in GITHUB_TOKEN: token pushes are
      # attributed to the Actions bot and are not a dependable activity signal.
      # Runs even when an earlier step failed, so a bad TMDB day still keeps the
      # schedule alive — but never fails the job, since the page is already live.
      - name: Keepalive commit
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          KEEPALIVE_PAT: ${{ secrets.KEEPALIVE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${KEEPALIVE_PAT:-}" ]; then
            echo "::warning::KEEPALIVE_PAT is not set — skipping keepalive. Without it, GitHub will auto-disable this workflow's daily schedule after 60 days with no push."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-refresh
          git config user.name  "jimmy623"
          git config user.email "jimmy623@users.noreply.github.com"
          git add .last-refresh
          if git diff --cached --quiet; then
            echo "Stamp unchanged — nothing to push."
            exit 0
          fi
          git commit -m "chore: daily refresh stamp (keeps the Actions schedule alive)"
          # Belt and braces for checkout's persist-credentials:false — strip any
          # auth header that still made it into the config, then log the key NAMES
          # (never values) so the next 403, if there is one, is one glance to read.
          for k in $(git config --local --name-only --get-regexp '^http\..*\.extraheader$' || true); do
            git config --local --unset-all "$k" || true
          done
          echo "local git config keys: $(git config --local --name-only --list | tr '\n' ' ')"
          git remote set-url --push origin "https://x-access-token:${KEEPALIVE_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Keepalive pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}) — rebasing onto origin/main and retrying."
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; break; }
          done
          echo "::warning::Keepalive push did not land. The daily schedule is at risk if this keeps happening."
